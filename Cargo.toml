[package]
name = "incontrol"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[dependencies]
# Builds against the Horizon checkout it sits in, from `.local/dev-mods/incontrol` (see README.md);
# with a Nightly that has every API it uses, this becomes the pinned SDK path `cargo horizon-mod`
# writes.
horizon-mod-api = { path = "../../../crates/horizon-mod-api" }
# The rule files: the original reads them with Gson.
serde_json = "1"

# A mod is its own project, not a member of the game's workspace.
[workspace]
